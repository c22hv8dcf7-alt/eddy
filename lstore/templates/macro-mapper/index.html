<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro-Tracker Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; color: #38bdf8; font-size: 24px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
        .map-placeholder {
            height: 250px;
            background-color: #020617;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #475569;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-reset {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover { background-color: #dc2626; }
        .organism-badge {
            background-color: #334155;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .organism-badge:hover { background-color: #475569; }
        .count-num { background: #020617; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Macro-Tracker Workspace</h1>
                <p style="margin: 5px 0 0 0; color: #94a3b8;">Log field observation counts and register stream health data.</p>
            </div>
            <!-- Pre-wired Reset Button right next to the title -->
            <button class="btn-reset" onclick="resetAllCounters()">Reset Counts</button>
        </header>
        
        <div class="grid">
            <div class="card">
                <h3>Stream Sampling Site</h3>
                <div class="map-placeholder" id="map-status">📍 No coordinate pin dropped yet</div>
                <button class="btn" onclick="dropPin()">Pin Current Location</button>
            </div>
            
            <div class="card">
                <h3>Quick Click Counter</h3>
                <p style="font-size: 12px; color: #94a3b8; margin-top: -10px; margin-bottom: 15px;">Click any row to increase the count:</p>
                
                <div class="organism-badge" onclick="addCount('scud')">
                    <span>🦐 Scud / Amphipoda</span>
                    <span class="count-num" id="scud-count" style="color: #fbbf24;">0</span>
                </div>
                <div class="organism-badge" onclick="addCount('stonefly')">
                    <span>🪰 Stonefly Nymph</span>
                    <span class="count-num" id="stonefly-count" style="color: #34d399;">0</span>
                </div>
                <div class="organism-badge" onclick="addCount('mayfly')">
                    <span>🦟 Mayfly Nymph</span>
                    <span class="count-num" id="mayfly-count" style="color: #34d399;">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let counts = { scud: 0, stonefly: 0, mayfly: 0 };

        function addCount(type) {
            counts[type]++;
            document.getElementById(type + '-count').innerText = counts[type];
        }

        function dropPin() {
            document.getElementById('map-status').innerText = "📍 Coordinates Pinned successfully!";
            document.getElementById('map-status').style.borderColor = "#34d399";
            document.getElementById('map-status').style.color = "#34d399";
        }

        // Functional reset operation logic
        function resetAllCounters() {
            counts = { scud: 0, stonefly: 0, mayfly: 0 };
            document.getElementById('scud-count').innerText = "0";
            document.getElementById('stonefly-count').innerText = "0";
            document.getElementById('mayfly-count').innerText = "0";
        }
    </script>
</body>
</html>
