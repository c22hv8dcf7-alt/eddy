[package]
name = "eddy"
version = "0.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Go Direct (wired USB) bridge — see src/gdx.rs. `vendored` builds the
# bundled libusb from source so local builds need no separate libusb
# install (e.g. via Homebrew on macOS).
rusb = { version = "0.9", features = ["vendored"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
